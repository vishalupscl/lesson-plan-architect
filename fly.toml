# fly.toml app configuration file generated for teacher-lp-profiler on 2026-07-07T08:22:18Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'teacher-lp-profiler'
primary_region = 'lhr'

[build]

# Persistent disk for the teacher profile records store. Create the volume
# once (`fly volumes create data --region lhr --size 1`) and set
# DATA_DIR=/data (`fly secrets set DATA_DIR=/data`) so records survive
# deploys and restarts.
[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
